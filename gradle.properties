# Rendimiento y Paralelismo
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.vfs.watch=true

# Optimización de Memoria Agresiva
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1G -Djava.awt.headless=true
kotlin.daemon.jvmargs=-Xmx6144M

# Optimización de Kotlin
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true

# Android Performance
android.nonTransitiveRClass=true
android.enableJetifier=false
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# android.enableBuildCache=true

# ABI Warnings suppression
android.sync.suppressAgpWarnings=CANNOT_BUILD_SELECTED_TARGET_ABI,UNSUPPORTED_PROJECT_OPTION_USE

# Corrección para KSP
ksp.incremental=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
